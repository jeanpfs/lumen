[package]
name = "lumen-core"
version = "0.1.1"
edition = "2021"
description = "Protocol, connection pool and setup logic for Bluetooth LE LED strips"
license = "MIT"
repository = "https://github.com/jeanpfs/lumen"
publish = false

[features]
ble = ["dep:btleplug"]

[dependencies]
async-trait = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }
tokio = { version = "1", features = ["sync", "time"] }
btleplug = { version = "0.13", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tempfile = "3"
parking_lot = "0.12"
